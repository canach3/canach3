<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Cana — Backend Developer</title>
  <desc id="desc">실시간 결제 · 경매 · 채팅처럼 정합성이 중요한 흐름을 설계하고 구현합니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1d"/>
      <stop offset="1" stop-color="#0f1c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#34d399" stop-opacity=".26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="300" rx="22"/></clipPath>
    <clipPath id="type0"><rect x="559" y="94" width="56.8" height="20"><animate attributeName="width" calcMode="discrete" values="0;7.8;15.6;23.4;31.2;39;56.8" keyTimes="0;0.6818;0.7348;0.7879;0.8409;0.8939;0.947" dur="1.32s" fill="freeze"/></rect></clipPath>
    <clipPath id="type1"><rect x="559" y="138" width="111.4" height="20"><animate attributeName="width" calcMode="discrete" values="0;7.8;15.6;23.4;31.2;39;46.8;54.6;62.4;70.2;78;85.8;93.6;111.4" keyTimes="0;0.7045;0.7273;0.75;0.7727;0.7955;0.8182;0.8409;0.8636;0.8864;0.9091;0.9318;0.9545;0.9773" dur="3.08s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="559" y="182" width="111.4" height="20"><animate attributeName="width" calcMode="discrete" values="0;7.8;15.6;23.4;31.2;39;46.8;54.6;62.4;70.2;78;85.8;93.6;111.4" keyTimes="0;0.812;0.8264;0.8409;0.8554;0.8698;0.8843;0.8988;0.9132;0.9277;0.9421;0.9566;0.9711;0.9855" dur="4.84s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .31s; } .d4 { animation-delay: .44s; } .d5 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .orb-a { animation: driftA 16s ease-in-out infinite alternate; }
    .orb-b { animation: driftB 21s ease-in-out infinite alternate; }
    @keyframes driftA { to { transform: translate(70px, 36px); } }
    @keyframes driftB { to { transform: translate(-80px, -30px); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(2.8); opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .orb-a, .orb-b, .pulse, .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="960" height="300" fill="url(#bg)"/>
    <circle class="orb-a" cx="120" cy="20" r="260" fill="url(#glowA)"/>
    <circle class="orb-b" cx="880" cy="310" r="280" fill="url(#glowB)"/>
    <rect width="960" height="300" fill="url(#dots)"/>
    <rect y="297" width="960" height="3" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="299" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g class="rise d1">
    <rect x="56" y="46" width="146" height="28" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <circle class="pulse" cx="74" cy="60" r="4" fill="#34d399"/>
    <circle cx="74" cy="60" r="4" fill="#34d399"/>
    <text class="mono" x="88" y="64.5" font-size="12" fill="#c9d5e3">canacode.blog</text>
  </g>
  <text class="sans rise d2" x="53" y="160" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#accent)">Cana</text>
  <text class="sans rise d3" x="58" y="200" font-size="26" font-weight="600" fill="#e6edf3">Backend Developer</text>
  <g class="sans rise d4" font-size="15" fill="#8b98ab">
    <text x="58" y="234">실시간 결제 · 경매 · 채팅처럼</text>
    <text x="58" y="256">정합성이 중요한 흐름을 설계하고 구현합니다.</text>
  </g>

  <g class="rise d5">
    <rect x="520" y="44" width="392" height="212" rx="12" fill="#0a1222" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="542" cy="62" r="5.5" fill="#ff5f57"/>
    <circle cx="560" cy="62" r="5.5" fill="#febc2e"/>
    <circle cx="578" cy="62" r="5.5" fill="#28c840"/>
    <text class="mono" x="716" y="66" font-size="12" text-anchor="middle" fill="#64748b">cana@github: ~</text>
    <line x1="520" y1="80" x2="912" y2="80" stroke="#ffffff" stroke-opacity=".08"/>
    <g class="mono" font-size="13">
      <g><text x="544" y="108" fill="#34d399">$</text><text x="560" y="108" fill="#e6edf3" clip-path="url(#type0)">whoami</text></g>
      <text x="544" y="130" fill="#9fb0c5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9236;1" dur="1.57s" fill="freeze"/>cana · backend developer</text>
      <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9236;1" dur="1.57s" fill="freeze"/><text x="544" y="152" fill="#34d399">$</text><text x="560" y="152" fill="#e6edf3" clip-path="url(#type1)">ls ~/projects</text></g>
      <text x="544" y="174" fill="#7dd3fc"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.964;1" dur="3.33s" fill="freeze"/>tikkle  tripagora  vintib  license-hunter</text>
      <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.964;1" dur="3.33s" fill="freeze"/><text x="544" y="196" fill="#34d399">$</text><text x="560" y="196" fill="#e6edf3" clip-path="url(#type2)">cat focus.txt</text></g>
      <text x="544" y="218" fill="#9fb0c5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9764;1" dur="5.09s" fill="freeze"/>real-time payments · auctions · chat</text>
      <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9764;1" dur="5.09s" fill="freeze"/><text x="544" y="240" fill="#34d399">$</text><rect class="cursor" x="560" y="228" width="8" height="15" rx="1" fill="#34d399"/></g>
    </g>
  </g>
</svg>
